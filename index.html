<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Planner</title>
  <style>
    :root {
      --page-bg: #f7f3ed;
      --card-bg: #fffdfa;
      --text: #403b36;
      --muted: #9b9084;
      --border: #eee7de;
      --accent: #a9c5b4;
      --accent-text: #30483a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 30px; background: var(--page-bg); color: var(--text);
      font-family: "Pretendard", "Malgun Gothic", sans-serif;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid #b9a28d; outline-offset: 2px;
    }
    .planner {
      display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 24px;
      max-width: 1400px; margin: 0 auto;
    }
    .sidebar, .calendar-card {
      padding: 24px; background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 20px;
    }
    h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: -1px; }
    .subtitle { margin: 0 0 28px; color: var(--muted); font-size: 13px; }
    h3 { margin: 0 0 16px; font-size: 16px; }
    label { margin-top: 4px; color: #655b52; font-size: 13px; font-weight: 600; }
    input, select {
      width: 100%; min-width: 0; padding: 10px; border: 1px solid #e9e2d9;
      border-radius: 9px; background: var(--card-bg); color: var(--text); font-size: 13px;
    }
    button {
      padding: 10px 11px; border: 0; border-radius: 9px; font-size: 13px;
      font-weight: 600; transition: background-color .2s;
    }
    .subject-form, .schedule-form, .settings-form { display: flex; flex-direction: column; gap: 10px; }
    .subject-form { margin-bottom: 28px; }
    .primary-button { background: #d7a7a0; color: var(--text); }
    .primary-button:hover { background: #c9958d; }
    .green-button { background: var(--accent); color: var(--accent-text); }
    .green-button:hover { filter: brightness(.96); }
    .subject-list { display: flex; flex-direction: column; gap: 10px; }
    .subject-item {
      display: flex; align-items: center; gap: 9px; padding: 10px 12px;
      border: 1px solid var(--border); border-radius: 10px; font-size: 14px;
    }
    .subject-color { width: 12px; height: 12px; flex-shrink: 0; border-radius: 50%; }
    .subject-name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .small-button { padding: 6px 8px; background: #f3eee7; color: #655b52; font-size: 11px; }
    .small-button:hover { background: #e9e0d5; }
    .danger-button { background: #f5e5e1; color: #995e56; }
    .danger-button:hover { background: #edd3cd; }
    .schedule-form, .settings-form {
      margin-top: 28px; padding-top: 24px; border-top: 1px solid #e9e2d9;
    }
    .sidebar-note { margin-top: 24px; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .main-content { min-width: 0; }
    .calendar-header {
      display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 28px;
    }
    .month-title { margin: 0; font-size: 25px; letter-spacing: -.5px; }
    .month-controls { display: flex; gap: 8px; }
    .month-controls button { width: 36px; height: 36px; padding: 0; background: #f3eee7; color: #655b52; font-size: 18px; }
    .month-controls button:hover { background: #e9e0d5; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
    .weekday { padding: 10px 0; color: #8c8074; text-align: center; font-size: 13px; font-weight: 600; }
    .day {
      min-width: 0; min-height: 110px; padding: 9px 6px; border: 1px solid var(--border);
      border-radius: 10px; background: var(--card-bg); overflow-wrap: anywhere;
    }
    .day-number {
      display: inline-flex; align-items: center; justify-content: center; min-width: 27px;
      min-height: 27px; margin: -4px 0 5px -3px; padding: 4px; border: 0;
      border-radius: 50%; background: transparent; color: var(--text); font-size: 13px; font-weight: 600;
    }
    .day-number:hover { background: #f0e6da; }
    .day-sunday .day-number { color: #c48d86; }
    .empty-day { min-height: 110px; }
    .schedule-chip {
      margin-top: 5px; padding: 5px 6px; border-radius: 5px; color: var(--text);
      font-size: 11px; line-height: 1.4; overflow-wrap: anywhere;
    }
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px;
    }
    .toolbar button { background: #f3eee7; color: #655b52; }
    .toolbar button:hover { background: #e9e0d5; }
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center;
      justify-content: center; padding: 18px; background: rgba(52, 45, 38, .38);
    }
    .modal-backdrop[hidden] { display: none; }
    .modal {
      width: 100%; max-width: 460px; max-height: 85vh; overflow-y: auto; padding: 25px;
      border: 1px solid var(--border); border-radius: 18px; background: var(--card-bg);
      box-shadow: 0 18px 60px rgba(52, 45, 38, .18);
    }
    .modal-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
    .modal-title { margin: 0 0 6px; font-size: 21px; }
    .modal-date { margin: 0; color: var(--muted); font-size: 13px; }
    .close-modal { width: 34px; height: 34px; padding: 0; background: #f3eee7; color: #655b52; font-size: 20px; }
    .modal-form { display: flex; flex-direction: column; gap: 10px; }
    .modal-form button[type="submit"] { margin-top: 5px; background: var(--accent); color: var(--accent-text); }
    .modal-schedule-list { display: flex; flex-direction: column; gap: 10px; margin-top: 24px; padding-top: 20px; border-top: 1px solid #e9e2d9; }
    .modal-schedule-list h3 { margin-bottom: 2px; }
    .empty-message, .no-subject-message { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .modal-schedule-item {
      display: flex; align-items: flex-start; gap: 9px; padding: 11px;
      border: 1px solid var(--border); border-radius: 10px;
    }
    .modal-schedule-color { width: 10px; height: 10px; flex-shrink: 0; margin-top: 4px; border-radius: 50%; }
    .modal-schedule-info { flex: 1; min-width: 0; }
    .modal-schedule-subject { margin-bottom: 4px; color: #8c8074; font-size: 11px; }
    .modal-schedule-task { font-size: 13px; overflow-wrap: anywhere; white-space: pre-wrap; }
    .modal-item-actions { display: flex; flex-wrap: wrap; gap: 5px; }
    .delete-schedule { padding: 6px 8px; background: #f5e5e1; color: #995e56; font-size: 11px; }
    .edit-schedule { padding: 6px 8px; background: #e8edf4; color: #4c6285; font-size: 11px; }
    .modal-form-actions { display: flex; gap: 8px; }
    .modal-form-actions button { flex: 1; }
    .secondary-button { background: #f3eee7; color: #655b52; }
    .settings-preview { color: var(--muted); font-size: 12px; line-height: 1.5; }
    @media (max-width: 800px) {
      body { padding: 14px; }
      .planner { grid-template-columns: 1fr; }
      .sidebar, .calendar-card { padding: 18px; }
      .calendar-grid { gap: 4px; }
      .day { min-height: 85px; padding: 6px 3px; }
      .empty-day { min-height: 85px; }
      .schedule-chip { padding: 4px 3px; font-size: 10px; }
    }

    .sidebar-nav { display:flex; flex-wrap:wrap; gap:7px; margin:18px 0 20px; }
    .nav-button { flex:1 1 30%; padding:9px 7px; border:1px solid var(--border); background:#fffdfa; color:var(--muted); font-size:12px; }
    .nav-button.active { background:var(--accent); color:var(--accent-text); border-color:var(--accent); }
    .side-panel[hidden] { display:none; }
    .side-panel h3 { margin-top:0; }
    .exam-form { display:flex; flex-direction:column; gap:9px; }
    .exam-form input, .exam-form select, .exam-form textarea { width:100%; }
    .exam-list { display:flex; flex-direction:column; gap:9px; margin-top:15px; }
    .exam-list-item { padding:11px; border:1px solid var(--border); border-radius:10px; background:#fffdfa; }
    .exam-list-item strong { display:block; margin-bottom:4px; }
    .exam-list-item small { display:block; color:var(--muted); line-height:1.5; }
    .exam-list-actions { display:flex; gap:6px; margin-top:8px; }
    .exam-chip { display:block; width:100%; margin-top:4px; padding:4px 5px; border:0; border-radius:5px; text-align:left; font-size:10px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#403b36; }
    /* 시험이 있는 날만 배경색 변경 */
    .day { cursor:pointer; }
    .day.exam-day { background:#fbeceb; border-color:#efcfcc; }
    /* 캘린더 배경 이미지 (투명도 조절) */
    .calendar-card { position:relative; overflow:hidden; }
    .calendar-card::before {
      content:""; position:absolute; inset:0; z-index:0; pointer-events:none;
      background-image:var(--cal-bg-image, none); background-size:cover; background-position:center;
      opacity:var(--cal-bg-opacity, .3);
    }
    .calendar-card > * { position:relative; z-index:1; }
    .calendar-card.has-bg .day { background:rgba(255,253,250,.6); }
    .calendar-card.has-bg .day.exam-day { background:rgba(251,236,235,.9); }
    .settings-form input[type="range"] { padding:0; }
    .settings-form input[type="file"] { padding:8px; }
    /* 날짜 팝업 탭 */
    .modal-tabs { display:flex; gap:6px; margin-bottom:18px; }
    .modal-tab { flex:1; background:#f3eee7; color:#655b52; }
    .modal-tab.active { background:var(--accent); color:var(--accent-text); }
    .modal-pane[hidden] { display:none; }
    .modal-exam-meta { margin-top:4px; color:var(--muted); font-size:12px; line-height:1.5; overflow-wrap:anywhere; }
    .day-number.holiday-number { color:#c45b5b; }
    .day-number.exam-day-number { border:2px solid #d36b6b; border-radius:50%; color:#bd5353; }
    .export-options { display:flex; flex-wrap:wrap; align-items:end; gap:10px; margin:12px 0 4px; padding:14px; background:#faf7f2; border:1px solid var(--border); border-radius:12px; }
    .export-options label { display:flex; flex-direction:column; gap:5px; font-size:12px; color:var(--muted); }
    .export-options input, .export-options select { min-height:36px; }
    .exam-modal-note { white-space:pre-wrap; overflow-wrap:anywhere; }
    @media (max-width: 800px) { .planner { grid-template-columns:1fr; } .sidebar-nav { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); } }
  </style>
</head>
<body>
  <div class="planner">
    <aside class="sidebar">
      <h1>Study Plan Calendar</h1>
      <p class="subtitle">You can design your own study planner</p>

      <nav class="sidebar-nav" aria-label="설정 메뉴">
        <button type="button" class="nav-button active" data-panel="subjects-panel">과목 관리</button>
        <button type="button" class="nav-button" data-panel="exams-panel">시험 일정</button>
        <button type="button" class="nav-button" data-panel="design-panel">디자인 설정</button>
      </nav>

      <section class="side-panel" id="subjects-panel">
        <div class="subject-form">
          <h3>과목 추가</h3>
          <label for="subject-name">과목 이름</label>
          <input type="text" id="subject-name" placeholder="과목 이름 입력">
          <label for="subject-color">과목 색상</label>
          <select id="subject-color">
            <option value="#D7A7A0">로즈</option><option value="#F0C6A8">피치</option><option value="#E8D38F">버터</option><option value="#A9C5B4">민트</option><option value="#A9C8DF">스카이</option><option value="#C2B4D8">라벤더</option>
          </select>
          <button type="button" class="primary-button" id="add-subject">+ 과목 추가</button>
        </div>
        <h3>과목 목록</h3><div class="subject-list" id="subject-list"></div>
      </section>

      <section class="side-panel" id="exams-panel" hidden>
        <h3 id="exam-form-heading">시험 일정 추가</h3>
        <form class="exam-form" id="exam-form">
          <label for="exam-subject">과목</label><select id="exam-subject" required></select>
          <label for="exam-date">시험 날짜</label><input type="date" id="exam-date" required>
          <label for="exam-time">시험 시간</label><input type="text" id="exam-time" placeholder="예: 10:00~11:15">
          <label for="exam-scope">시험 범위</label><input type="text" id="exam-scope" placeholder="예: 5장~7장">
          <label for="exam-memo">메모 (선택)</label><textarea id="exam-memo" rows="2" placeholder="시험정보나 유의사항"></textarea>
          <button type="submit" class="primary-button" id="save-exam">+ 시험 일정 추가</button>
          <button type="button" class="secondary-button" id="cancel-exam-edit" hidden>수정 취소</button>
        </form>
        <div class="exam-list" id="exam-list"></div>
      </section>

      <section class="side-panel settings-form" id="design-panel" hidden>
        <h3>디자인 설정</h3>
        <label for="page-bg">배경 색상</label>
        <select id="page-bg"><option value="#F7F3ED">웜 베이지</option><option value="#F3F4F0">세이지 화이트</option><option value="#F7F0F2">로즈 화이트</option><option value="#EEF3F7">쿨 블루</option><option value="#F5F0E6">크림</option></select>
        <label for="accent-color">강조 색상</label>
        <select id="accent-color"><option value="#A9C5B4">민트</option><option value="#D7A7A0">로즈</option><option value="#A9C8DF">스카이</option><option value="#C2B4D8">라벤더</option><option value="#E8D38F">버터</option></select>
        <label for="bg-image-file">캘린더 배경 이미지</label>
        <input type="file" id="bg-image-file" accept="image/*">
        <label for="bg-opacity">이미지 불투명도 <span id="bg-opacity-value">30%</span></label>
        <input type="range" id="bg-opacity" min="5" max="100" step="5" value="30">
        <button type="button" class="secondary-button" id="remove-bg-image">배경 이미지 제거</button>
        <button type="button" class="green-button" id="apply-design">디자인 적용</button>
        <p class="settings-preview">선택한 디자인은 자동 저장.</p>
      </section>
      <p class="sidebar-note">날짜를 누르면 공부 일정을 추가하거나 수정·삭제할 수 있습니다. 시험은 ‘시험 일정’ 메뉴에서 관리.</p>
    </aside>

    <main class="main-content">
      <div class="calendar-card" id="calendar-card">
        <div class="calendar-header">
          <h2 class="month-title" id="month-title"></h2>
          <div class="month-controls">
            <button type="button" id="prev-month" aria-label="이전 달">‹</button>
            <button type="button" id="next-month" aria-label="다음 달">›</button>
          </div>
        </div>
        <div class="calendar-grid" id="calendar-grid"></div>
        <div class="export-options">
          <label>시작 날짜<input type="date" id="export-start"></label>
          <label>종료 날짜<input type="date" id="export-end"></label>
          <label>이미지 방향<select id="export-orientation"><option value="landscape">가로형</option><option value="portrait">세로형</option></select></label>
          <button type="button" id="export-image">선택한 기간을 PNG로 저장</button>
        </div>
        <p class="settings-preview">선택한 기간만 불필요한 여백 없이 PNG로 저장됩니다</p>
      </div>
    </main>
  </div>

  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <div>
          <h2 class="modal-title" id="modal-title">공부 일정</h2>
          <p class="modal-date" id="modal-date"></p>
        </div>
        <button type="button" class="close-modal" id="close-modal" aria-label="팝업 닫기">×</button>
      </div>
      <div class="modal-tabs">
        <button type="button" class="modal-tab active" data-tab="study">공부 일정</button>
        <button type="button" class="modal-tab" data-tab="exam" id="exam-tab-button">시험 일정</button>
      </div>
      <div class="modal-pane" id="study-pane">
      <form class="modal-form" id="modal-form">
        <label for="modal-subject">과목</label>
        <select id="modal-subject" required></select>
        <label for="modal-task">공부할 내용</label>
        <input type="text" id="modal-task" placeholder="공부할 내용 입력" required>
        <div class="modal-form-actions">
          <button type="submit" id="modal-submit">+ 일정 추가</button>
          <button type="button" class="secondary-button" id="cancel-edit" hidden>수정 취소</button>
        </div>
        <p class="no-subject-message" id="no-subject-message" hidden>일정을 추가하려면 먼저 과목을 추가해주세요.</p>
      </form>
      <div class="modal-schedule-list">
        <h3>이 날짜의 일정</h3>
        <div id="modal-schedules"></div>
      </div>
      </div>
      <div class="modal-pane" id="exam-pane" hidden>
        <form class="modal-form" id="modal-exam-form">
          <label for="modal-exam-subject">과목</label>
          <select id="modal-exam-subject" required></select>
          <label for="modal-exam-time">시험 시간</label>
          <input type="text" id="modal-exam-time" placeholder="예: 10:00~11:15">
          <label for="modal-exam-scope">시험 범위</label>
          <input type="text" id="modal-exam-scope" placeholder="예: 5장~7장">
          <label for="modal-exam-memo">메모 (선택)</label>
          <input type="text" id="modal-exam-memo" placeholder="준비물이나 유의사항">
          <div class="modal-form-actions">
            <button type="submit" id="modal-exam-submit">+ 시험 추가</button>
            <button type="button" class="secondary-button" id="modal-exam-cancel" hidden>수정 취소</button>
          </div>
        </form>
        <div class="modal-schedule-list">
          <h3>이 날짜의 시험</h3>
          <div id="modal-exams"></div>
        </div>
      </div>
    </section>
  </div>

  <div class="modal-backdrop" id="exam-detail-backdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="exam-detail-title">
      <div class="modal-header"><div><h2 class="modal-title" id="exam-detail-title">시험 일정</h2><p class="modal-date" id="exam-detail-date"></p></div><button type="button" class="close-modal" id="close-exam-detail" aria-label="팝업 닫기">×</button></div>
      <div id="exam-detail-content" class="exam-modal-note"></div>
      <div class="modal-form-actions" style="margin-top:18px"><button type="button" id="edit-exam-detail">수정</button><button type="button" class="delete-schedule" id="delete-exam-detail">삭제</button></div>
    </section>
  </div>

  <script>
    const STORAGE_KEY = "studyPlannerData_v2";
    const emptyData = () => ({
      subjects: [],
      schedules: [],
      exams: [],
      design: { pageBg: "#F7F3ED", accent: "#A9C5B4", bgImage: "", bgOpacity: 30 }
    });

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return emptyData();
        const data = JSON.parse(raw);
        return {
          subjects: Array.isArray(data.subjects) ? data.subjects : [],
          schedules: Array.isArray(data.schedules) ? data.schedules : [],
          exams: Array.isArray(data.exams) ? data.exams : [],
          design: {
            pageBg: data.design?.pageBg || "#F7F3ED",
            accent: data.design?.accent || "#A9C5B4",
            bgImage: data.design?.bgImage || "",
            bgOpacity: data.design?.bgOpacity ?? 30
          }
        };
      } catch (error) {
        console.error("저장 데이터를 불러오지 못했습니다.", error);
        return emptyData();
      }
    }

    const initialData = loadData();
    let subjects = initialData.subjects;
    let schedules = initialData.schedules;
    let exams = initialData.exams || [];
    let editingExamId = null;
    let selectedExamId = null;
    let design = initialData.design;
    let currentDate = new Date(2026, 10, 1);
    let selectedDate = "";
    let editingScheduleId = null;

    const $ = (id) => document.getElementById(id);
    const subjectNameInput = $("subject-name");
    const subjectColorSelect = $("subject-color");
    const subjectList = $("subject-list");
    const monthTitle = $("month-title");
    const calendarGrid = $("calendar-grid");
    const backdrop = $("modal-backdrop");
    const modalDate = $("modal-date");
    const modalSubjectSelect = $("modal-subject");
    const modalTaskInput = $("modal-task");
    const modalForm = $("modal-form");
    const modalSchedules = $("modal-schedules");
    const modalSubmit = $("modal-submit");
    const cancelEditButton = $("cancel-edit");
    const noSubjectMessage = $("no-subject-message");
    const examSubjectSelect = $("exam-subject");
    const examForm = $("exam-form");

    function saveData() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ subjects, schedules, exams, design }));
      } catch (error) {

    // 선택한 기간의 달력을 월별로 세로로 연결해 PNG로 저장
    function drawExamBadge(ctx, exam, x, y, width) {
      const subject=getSubject(exam.subject); ctx.fillStyle=subject?subject.color:"#f0d7d7"; roundRect(ctx,x,y,width,23,5);ctx.fill();ctx.fillStyle="#403b36";ctx.font="12px sans-serif";drawWrappedText(ctx,exam.subject,x+6,y+15,width-12,1);

    $("export-image").addEventListener("click", () => {
      const startValue = $("export-start").value, endValue = $("export-end").value;
      if (!startValue || !endValue) { alert("시작 날짜와 종료 날짜를 모두 선택하세요"); return; }
      const startDate = new Date(startValue + "T12:00:00"), endDate = new Date(endValue + "T12:00:00");
      if (startDate > endDate) { alert("종료 날짜는 시작 날짜와 같거나 뒤여야 합니다."); return; }

      const orientation = $("export-orientation").value;
      const width = orientation === "landscape" ? 1600 : 1100;
      const frame = 10, pad = 22, gap = 18, margin = frame + pad + 4;
      const titleH = 62, weekdayH = 8, minRowH = orientation === "landscape" ? 66 : 76;
      const cellW = (width - margin * 2) / 7;
      const pad2 = n => String(n).padStart(2, "0");
      const keyOf = (y, mo, d) => `${y}-${pad2(mo + 1)}-${pad2(d)}`;
      const examDetail = exam => [exam.time, exam.scope].filter(Boolean).join(" · ");
      // 날짜 칸에 실제로 필요한 높이만 계산 → 빈 공간 제거
      const cellNeed = key => {
        const s = Math.min(3, schedules.filter(x => x.date === key).length);
        const ex = exams.filter(x => x.date === key).slice(0, 3);
        return 31 + s * 23 + ex.reduce((sum, e) => sum + (examDetail(e) ? 38 : 27), 0) + 9;
      };

      // 선택한 기간에 해당하는 주(행)만 그린다
      const blocks = [];
      let cursor = new Date(startDate.getFullYear(), startDate.getMonth(), 1);
      while (cursor <= endDate) {
        const y = cursor.getFullYear(), mo = cursor.getMonth(), lastDay = new Date(y, mo + 1, 0).getDate();
        const a = (y === startDate.getFullYear() && mo === startDate.getMonth()) ? startDate.getDate() : 1;
        const b = (y === endDate.getFullYear() && mo === endDate.getMonth()) ? endDate.getDate() : lastDay;
        const firstDay = (new Date(y, mo, 1).getDay() + 6) % 7;
        const firstRow = Math.floor((firstDay + a - 1) / 7), lastRow = Math.floor((firstDay + b - 1) / 7);
        const rowHeights = Array(lastRow - firstRow + 1).fill(minRowH);
        for (let d = a; d <= b; d++) {
          const r = Math.floor((firstDay + d - 1) / 7) - firstRow;
          rowHeights[r] = Math.max(rowHeights[r], cellNeed(keyOf(y, mo, d)));
        }
        const rowTops = []; let acc = 0;
        rowHeights.forEach(h => { rowTops.push(acc); acc += h; });
        blocks.push({ y, mo, a, b, firstDay, firstRow, rowHeights, rowTops, height: titleH + weekdayH + acc });
        cursor = new Date(y, mo + 1, 1);
      }

      const scale = 2;
      const height = (frame + pad) * 2 + blocks.reduce((sum, b) => sum + b.height, 0) + gap * (blocks.length - 1);
      const canvas = document.createElement("canvas");
      canvas.width = width * scale; canvas.height = height * scale;
      const ctx = canvas.getContext("2d");
      ctx.scale(scale, scale);

      const hasBg = !!(design.bgImage && bgImg && bgImg.complete && bgImg.naturalWidth);
      ctx.fillStyle = design.pageBg || "#F7F3ED"; ctx.fillRect(0, 0, width, height);
      ctx.fillStyle = "#fffdfa"; roundRect(ctx, frame, frame, width - frame * 2, height - frame * 2, 18); ctx.fill();
      if (hasBg) {
        const bw = width - frame * 2, bh = height - frame * 2;
        const k = Math.max(bw / bgImg.naturalWidth, bh / bgImg.naturalHeight);
        const iw = bgImg.naturalWidth * k, ih = bgImg.naturalHeight * k;
        ctx.save();
        roundRect(ctx, frame, frame, bw, bh, 18); ctx.clip();
        ctx.globalAlpha = (design.bgOpacity ?? 30) / 100;
        ctx.drawImage(bgImg, frame + (bw - iw) / 2, frame + (bh - ih) / 2, iw, ih);
        ctx.restore();
      }

      let top = frame + pad;
      const weekdays = ["월", "화", "수", "목", "금", "토", "일"];
      blocks.forEach(block => {
        ctx.fillStyle = "#403b36"; ctx.font = "bold 28px sans-serif";
        ctx.fillText(`${block.y}년 ${block.mo + 1}월`, margin, top + 30);
        ctx.font = "bold 15px sans-serif";
        weekdays.forEach((w, i) => { ctx.fillStyle = i >= 5 ? "#c45b5b" : "#8c8074"; ctx.fillText(w, margin + i * cellW + 8, top + titleH - 6); });
        for (let day = block.a; day <= block.b; day++) {
          const index = block.firstDay + day - 1, row = Math.floor(index / 7), col = index % 7;
          const r = row - block.firstRow, rowH = block.rowHeights[r];
          const x = margin + col * cellW, y = top + titleH + weekdayH + block.rowTops[r];
          const key = keyOf(block.y, block.mo, day);
          const dayExams = exams.filter(e => e.date === key);
          ctx.fillStyle = dayExams.length ? (hasBg ? "rgba(251,236,235,.9)" : "#fbeceb") : (hasBg ? "rgba(255,253,250,.6)" : "#fffdfa");
          roundRect(ctx, x + 2, y + 2, cellW - 5, rowH - 5, 7); ctx.fill();
          ctx.strokeStyle = dayExams.length ? "#efcfcc" : "#e8e0d6"; ctx.stroke();
          const dow = new Date(block.y, block.mo, day).getDay();
          ctx.fillStyle = (dow === 0 || dow === 6 || HOLIDAYS.has(key)) ? "#c45b5b" : "#403b36";
          ctx.font = "bold 16px sans-serif"; ctx.fillText(String(day), x + 9, y + 22);
          let iy = y + 31;
          schedules.filter(s => s.date === key).slice(0, 3).forEach(item => {
            const sub = getSubject(item.subject);
            ctx.fillStyle = sub ? sub.color : "#e8e0d6"; roundRect(ctx, x + 6, iy, cellW - 14, 20, 4); ctx.fill();
            ctx.fillStyle = "#403b36"; ctx.font = "11px sans-serif";
            drawWrappedText(ctx, `${item.subject}: ${item.task}`, x + 10, iy + 14, cellW - 22, 1);
            iy += 23;
          });
          dayExams.slice(0, 3).forEach(exam => {
            drawExamBadge(ctx, exam, x + 6, iy, cellW - 14);
            const detail = examDetail(exam);
            if (detail) { ctx.fillStyle = "#403b36"; ctx.font = "10px sans-serif"; ctx.fillText(detail.slice(0, 24), x + 8, iy + 34); }
            iy += detail ? 38 : 27;
          });
        }
        top += block.height + gap;
      });
      const link = document.createElement("a");
      link.download = `study-planner-${startValue}-to-${endValue}-${orientation}.png`;
      link.href = canvas.toDataURL("image/png");
      link.click();
    });

    function roundRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + width, y, x + width, y + height, radius);
      ctx.arcTo(x + width, y + height, x, y + height, radius);
      ctx.arcTo(x, y + height, x, y, radius);
      ctx.arcTo(x, y, x + width, y, radius);
      ctx.closePath();
    }

    function drawWrappedText(ctx, text, x, y, maxWidth, maxLines) {
      let output = "";
      for (const character of text) {
        const next = output + character;
        if (ctx.measureText(next).width > maxWidth) break;
        output = next;
      }
      if (output.length < text.length && output.length > 1) {
        output = output.slice(0, -1) + "…";
      }
      ctx.fillText(output, x, y);
    }

    $("cancel-exam-edit").addEventListener("click",resetExamForm);
    function renderExamList(){const list=$("exam-list");if(!list)return;list.innerHTML="";const ordered=[...exams].sort((a,b)=>a.date.localeCompare(b.date));if(!ordered.length){const p=document.createElement("p");p.className="empty-message";p.textContent="등록된 시험이 아직 없습니다.";list.appendChild(p);return;}ordered.forEach(exam=>{const item=document.createElement("div");item.className="exam-list-item";const strong=document.createElement("strong");strong.textContent=`${exam.date} · ${exam.subject}`;const small=document.createElement("small");small.textContent=[exam.time,exam.scope].filter(Boolean).join(" · ")||"상세 정보 없음";const actions=document.createElement("div");actions.className="exam-list-actions";const view=document.createElement("button");view.type="button";view.className="small-button edit-schedule";view.textContent="상세 보기";view.addEventListener("click",()=>openExamDetail(exam.id));actions.append(view);item.append(strong,small,actions);list.appendChild(item);});}
    function openExamDetail(id){selectedExamId=id;const exam=exams.find(e=>e.id===id);if(!exam)return;$("exam-detail-title").textContent=exam.subject+" 시험";$("exam-detail-date").textContent=exam.date;const content=$("exam-detail-content");content.innerHTML="";[["시험 시간",exam.time], ["시험 범위",exam.scope], ["메모",exam.memo]].forEach(([label,value])=>{if(!value)return;const p=document.createElement("p");const b=document.createElement("strong");b.textContent=label+" · ";p.append(b,document.createTextNode(value));content.appendChild(p);});if(!content.childNodes.length)content.textContent="등록된 상세 정보가 없어.";$("exam-detail-backdrop").hidden=false;}
    function closeExamDetail(){$("exam-detail-backdrop").hidden=true;selectedExamId=null;}
    $("close-exam-detail").addEventListener("click",closeExamDetail);$("exam-detail-backdrop").addEventListener("click",e=>{if(e.target===$("exam-detail-backdrop"))closeExamDetail();});
    $("edit-exam-detail").addEventListener("click",()=>{const exam=exams.find(e=>e.id===selectedExamId);if(!exam)return;closeExamDetail();document.querySelector('[data-panel="exams-panel"]').click();editingExamId=exam.id;examSubjectSelect.value=exam.subject;$("exam-date").value=exam.date;$("exam-time").value=exam.time||"";$("exam-scope").value=exam.scope||"";$("exam-memo").value=exam.memo||"";$("exam-form-heading").textContent="시험 일정 수정";$("save-exam").textContent="수정 내용 저장";$("cancel-exam-edit").hidden=false;});
    $("delete-exam-detail").addEventListener("click",()=>{if(!selectedExamId||!confirm("이 시험 일정을 삭제할까요?"))return;exams=exams.filter(e=>e.id!==selectedExamId);saveData();closeExamDetail();renderCalendar();});
    // ===== 날짜 팝업: 시험 일정 체크 / 추가 / 수정 / 삭제 =====
    let editingModalExamId = null;
    function setModalTab(tab) {
      $("study-pane").hidden = tab !== "study";
      $("exam-pane").hidden = tab !== "exam";
      document.querySelectorAll(".modal-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
    }
    document.querySelectorAll(".modal-tab").forEach(b => b.addEventListener("click", () => setModalTab(b.dataset.tab)));

    function resetModalExamForm() {
      editingModalExamId = null;
      $("modal-exam-form").reset();
      $("modal-exam-submit").textContent = "+ 시험 추가";
      $("modal-exam-cancel").hidden = true;
    }
    $("modal-exam-cancel").addEventListener("click", resetModalExamForm);

    $("modal-exam-form").addEventListener("submit", event => {
      event.preventDefault();
      const subject = $("modal-exam-subject").value;
      if (!selectedDate || !subject) return;
      const record = {
        id: editingModalExamId || createId(),
        subject,
        date: selectedDate,
        time: $("modal-exam-time").value.trim(),
        scope: $("modal-exam-scope").value.trim(),
        memo: $("modal-exam-memo").value.trim()
      };
      if (editingModalExamId) exams = exams.map(e => e.id === editingModalExamId ? record : e);
      else exams.push(record);
      saveData();
      resetModalExamForm();
      renderCalendar();
      renderModalExams();
    });

    function renderModalExams() {
      const box = $("modal-exams");
      box.innerHTML = "";
      const dayExams = exams.filter(e => e.date === selectedDate);
      $("exam-tab-button").textContent = dayExams.length ? `시험 일정 (${dayExams.length})` : "시험 일정";
      if (!dayExams.length) {
        const message = document.createElement("p");
        message.className = "empty-message";
        message.textContent = "이 날짜에는 등록된 시험이 없습니다";
        box.appendChild(message);
        return;
      }
      dayExams.forEach(exam => {
        const item = document.createElement("div");
        item.className = "modal-schedule-item";
        const dot = document.createElement("span");
        dot.className = "modal-schedule-color";
        const subject = getSubject(exam.subject);
        dot.style.backgroundColor = subject ? subject.color : "#d8d0c6";
        const info = document.createElement("div");
        info.className = "modal-schedule-info";
        const name = document.createElement("div");
        name.className = "modal-schedule-task";
        name.textContent = exam.subject + " 시험";
        info.appendChild(name);
        [["시간", exam.time], ["범위", exam.scope], ["메모", exam.memo]].forEach(([label, value]) => {
          if (!value) return;
          const line = document.createElement("div");
          line.className = "modal-exam-meta";
          line.textContent = `${label} · ${value}`;
          info.appendChild(line);
        });
        const actions = document.createElement("div");
        actions.className = "modal-item-actions";
        const edit = document.createElement("button");
        edit.type = "button";
        edit.className = "small-button edit-schedule";
        edit.textContent = "수정";
        edit.addEventListener("click", () => {
          editingModalExamId = exam.id;
          $("modal-exam-subject").value = exam.subject;
          $("modal-exam-time").value = exam.time || "";
          $("modal-exam-scope").value = exam.scope || "";
          $("modal-exam-memo").value = exam.memo || "";
          $("modal-exam-submit").textContent = "수정 내용 저장";
          $("modal-exam-cancel").hidden = false;
          $("modal-exam-time").focus();
        });
        const del = document.createElement("button");
        del.type = "button";
        del.className = "small-button delete-schedule";
        del.textContent = "삭제";
        del.addEventListener("click", () => {
          if (!confirm("이 시험 일정을 삭제할까요?")) return;
          exams = exams.filter(e => e.id !== exam.id);
          if (editingModalExamId === exam.id) resetModalExamForm();
          saveData();
          renderCalendar();
          renderModalExams();
        });
        actions.append(edit, del);
        item.append(dot, info, actions);
        box.appendChild(item);
      });
    }

    // ===== 캘린더 배경 이미지 =====
    let bgImg = null, bgImgSrc = "";
    function applyBackgroundImage() {
      const card = $("calendar-card");
      const opacity = design.bgOpacity ?? 30;
      if (design.bgImage) {
        card.style.setProperty("--cal-bg-image", `url("${design.bgImage}")`);
        card.classList.add("has-bg");
        if (bgImgSrc !== design.bgImage) { bgImgSrc = design.bgImage; bgImg = new Image(); bgImg.src = bgImgSrc; }
      } else {
        card.style.removeProperty("--cal-bg-image");
        card.classList.remove("has-bg");
        bgImg = null; bgImgSrc = "";
      }
      card.style.setProperty("--cal-bg-opacity", opacity / 100);
      $("bg-opacity").value = opacity;
      $("bg-opacity-value").textContent = opacity + "%";
    }
    $("bg-image-file").addEventListener("change", event => {
      const input = event.target, file = input.files[0];
      if (!file) return;
      if (!file.type.startsWith("image/")) { alert("이미지 파일을 선택해주세요"); input.value = ""; return; }
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          // 저장 공간을 아끼기 위해 긴 변 1600px 이하로 줄여서 저장
          const ratio = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
          const c = document.createElement("canvas");
          c.width = Math.round(img.naturalWidth * ratio);
          c.height = Math.round(img.naturalHeight * ratio);
          const cctx = c.getContext("2d");
          cctx.fillStyle = "#ffffff"; cctx.fillRect(0, 0, c.width, c.height);
          cctx.drawImage(img, 0, 0, c.width, c.height);
          design.bgImage = c.toDataURL("image/jpeg", 0.85);
          saveData();
          applyBackgroundImage();
          input.value = "";
        };
        img.onerror = () => alert("이미지를 불러오지 못했습니다.");
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
    $("bg-opacity").addEventListener("input", event => { design.bgOpacity = Number(event.target.value); applyBackgroundImage(); });
    $("bg-opacity").addEventListener("change", saveData);
    $("remove-bg-image").addEventListener("click", () => { design.bgImage = ""; saveData(); applyBackgroundImage(); });

    // 시작
    const today=new Date();$("export-start").value=dateKeyOf(today);$("export-end").value=dateKeyOf(new Date(today.getFullYear(),today.getMonth()+1,0));
    applyDesign();
    renderSubjects();
    renderCalendar();
  </script>
</body>
</html>
